name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject tags outside main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Create draft release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

      - name: Summarize release
        run: |
          echo "### Release ${{ github.ref_name }} (draft)" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch gate: tag reachable from origin/main" >> "$GITHUB_STEP_SUMMARY"

  upload-binaries:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            build-tool: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            build-tool: cargo-zigbuild
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            build-tool: cargo-zigbuild
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            build-tool: cargo-zigbuild
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            build-tool: cargo
          - target: aarch64-pc-windows-msvc
            os: windows-2025
            build-tool: cargo
          - target: x86_64-apple-darwin
            os: macos-26
            build-tool: cargo
          - target: aarch64-apple-darwin
            os: macos-26
            build-tool: cargo

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build and upload binary
        uses: step-security/upload-rust-binary-action@v1
        with:
          bin: quiczk
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          tar: unix
          zip: windows

      - name: Summarize upload
        if: always()
        run: echo "Target ${{ matrix.target }} finished with status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish release
    needs: upload-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

      - name: Summarize publish
        run: echo "### Release ${{ github.ref_name }} published" >> "$GITHUB_STEP_SUMMARY"
