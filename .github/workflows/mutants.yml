name: Mutants

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Diff against the base revision
        if: github.event_name == 'pull_request'
        run: git diff "origin/${{ github.base_ref }}"... > mutants.diff

      - name: Run mutation tests on changed code
        if: github.event_name == 'pull_request'
        run: cargo mutants --in-diff mutants.diff

      - name: Run full mutation tests
        if: github.event_name != 'pull_request'
        run: cargo mutants

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out
          if-no-files-found: ignore

      - name: Summarize verification
        if: always()
        run: echo "Mutation CI finished with status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
